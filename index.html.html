<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>강이안의 iPhone</title>
<style>
:root{--bg:#0c0d12;--bg2:#13151c;--card:#1a1d27;--card2:#242836;--line:#2b3040;--txt:#f3f4f8;--sub:#9ca3b5;--acc:#ff5a78;--acc2:#ff9a3d;--ok:#5ee6a8;--sb:46px;--bot:40px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#050506;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[data-action]{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[data-action]:not(.noanim){transition:transform .12s ease,opacity .12s ease,background-color .12s ease}
[data-action]:not(.noanim):active{transform:scale(.95);opacity:.8}
#stage{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:100%;max-width:430px;height:100%;max-height:932px;overflow:hidden;background:#0a0b10;isolation:isolate}
@media (min-width:500px) and (min-height:760px){#phone{height:calc(100dvh - 24px);border-radius:46px;border:1px solid #2e2e34;box-shadow:0 20px 80px rgba(255,90,120,.15),0 0 0 8px #101014}}
#wall{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(255,120,140,.28),transparent 55%),radial-gradient(circle at 88% 8%,rgba(255,154,61,.22),transparent 40%),linear-gradient(170deg,#0b0c12 0%,#191423 55%,#0c0b10 100%)}
#statusbar{position:absolute;left:0;right:0;top:0;height:var(--sb);z-index:100;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:15px;font-weight:600;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.sbr{display:flex;align-items:center;gap:6px;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:2px;height:11px}.bars i{display:block;width:3px;background:#fff;border-radius:1px}
.batt{position:relative;width:25px;height:12px;border:1.5px solid rgba(255,255,255,.6);border-radius:4px;padding:1px}
.batt i{display:block;height:100%;background:#fff;border-radius:2px}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:rgba(255,255,255,.6);border-radius:0 1px 1px 0}
#home{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;padding-top:var(--sb);padding-bottom:var(--bot)}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:10px 18px 6px;min-height:0}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wg{background:rgba(24,26,36,.6);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:14px;text-align:left;min-height:148px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;width:100%}
.wg small{color:var(--sub);font-size:11px}
.wg .big{font-size:26px;font-weight:800;line-height:1.15;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wg .tt{font-size:13px;font-weight:700;line-height:1.35}
.wx-t{font-size:34px;font-weight:300}
.wx-h{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.wx-h span{text-align:center}
.spacer{flex:1}
.apps4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px;min-height:44px;padding:2px;position:relative}
.ico{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.4);position:relative}
.ico.folder{background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:7px;gap:3px;font-size:17px;place-items:center}
.lbl{font-size:11px;color:#fff;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:78px;overflow:hidden;text-overflow:ellipsis}
.corner{margin-top:auto;align-self:flex-end;padding-bottom:2px}
.dots{display:flex;justify-content:center;gap:0;height:30px;flex:0 0 auto}
.dot{width:36px;height:30px;display:grid;place-items:center}
.dot i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.dot.on i{background:#fff}
.dock{margin:0 12px 4px;padding:12px 8px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-radius:30px;display:grid;grid-template-columns:repeat(4,1fr);flex:0 0 auto}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sb);padding-bottom:var(--bot);transform:translateX(100%);opacity:0;visibility:hidden;pointer-events:none;z-index:20;transition:transform .28s ease,opacity .28s ease,visibility 0s linear .28s}
.screen.active{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition:transform .28s ease,opacity .28s ease,visibility 0s}
.screen.folder{background:rgba(8,8,12,.55);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);transform:scale(1.08);justify-content:center;align-items:center;padding:var(--sb) 20px var(--bot)}
.screen.folder.active{transform:none}
.screen.cam{background:#000}
.nav{display:flex;align-items:center;height:48px;padding:0 6px;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg)}
.nav h2{flex:1;text-align:center;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.navbtn{width:44px;height:44px;font-size:32px;line-height:1;color:var(--acc);display:grid;place-items:center}
.navsp{width:44px;height:44px;display:block}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
.sec{padding:14px 16px 6px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.02em}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.05);text-align:left;width:100%}
.av{width:42px;height:42px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:20px;flex:0 0 42px;overflow:hidden}
.rm{flex:1;min-width:0}
.rt{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rr{font-size:12px;color:var(--sub);text-align:right;flex:0 0 auto;max-width:42%}
.red{color:#ff5b5b!important}.acc{color:var(--acc)!important}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--card2);color:var(--sub);margin-left:6px;font-weight:600}
.pill.hot{background:rgba(255,90,120,.2);color:var(--acc)}
.tabs{display:flex;gap:6px;padding:10px 12px;flex:0 0 auto}
.tab{flex:1;min-height:44px;border-radius:12px;background:var(--card);color:var(--sub);font-size:14px;font-weight:600}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.pane{display:none}.pane.on{display:block}
.card{margin:10px 14px;padding:14px;background:var(--card);border-radius:18px;border:1px solid var(--line);line-height:1.5;font-size:14px}
.card h3{font-size:15px;margin-bottom:6px}
.card p{color:#d5d8e2;font-size:13.5px;margin-top:4px}
.btn{min-height:44px;padding:0 18px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--card2);color:var(--txt)}
.btns{display:flex;gap:10px;padding:10px 14px;flex-wrap:wrap}
.sw{width:58px;height:44px;display:grid;place-items:center;flex:0 0 58px}
.sw i{display:block;width:51px;height:31px;border-radius:16px;background:#3a3f50;position:relative;transition:background .2s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.sw.on i{background:var(--ok)}.sw.on i::after{transform:translateX(20px)}
.bigtxt{font-size:44px;font-weight:300}
/* chat */
.msgs{padding:10px 12px 16px;display:flex;flex-direction:column;gap:7px}
.dv{align-self:center;font-size:11.5px;color:var(--sub);background:rgba(255,255,255,.07);padding:4px 12px;border-radius:12px;margin:6px 0}
.m{display:flex;flex-direction:column;max-width:100%}.m.me{align-items:flex-end}.m.you{align-items:flex-start}
.mn{font-size:12px;color:var(--sub);margin:0 0 3px 4px}
.ml{display:flex;align-items:flex-end;gap:6px;max-width:100%}
.b{max-width:min(72vw,300px);padding:9px 13px;border-radius:18px;line-height:1.45;font-size:15px;word-break:break-word;overflow-wrap:anywhere}
.m.me .b{background:linear-gradient(135deg,var(--acc),var(--acc2));border-bottom-right-radius:6px;color:#fff}
.m.you .b{background:var(--card2);border-bottom-left-radius:6px}
.mt{font-size:10.5px;color:var(--sub);flex:0 0 auto;white-space:nowrap}
.mnote{font-size:11px;color:var(--acc2);margin:3px 4px 0}
.stk{display:flex;flex-direction:column;align-items:center;font-size:56px;line-height:1.1;padding:6px 10px}.stk small{font-size:11px;color:var(--sub);text-align:center;max-width:150px}
.inbar{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg);flex:0 0 auto}
.inbar .fake{flex:1;min-height:44px;border-radius:22px;background:var(--card);color:var(--sub);text-align:left;padding:0 16px;font-size:14px}
.inbar .send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:18px}
/* photos */
.albums{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px}
.alb{border-radius:18px;overflow:hidden;background:var(--card);text-align:left;border:1px solid var(--line);display:block}
.alb .th{height:96px;display:grid;place-items:center;font-size:38px}
.alb .in{padding:9px 11px}.alb b{display:block;font-size:14px}.alb small{color:var(--sub);font-size:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.tile{aspect-ratio:1/1;display:grid;place-items:center;font-size:32px;position:relative;border-radius:3px;overflow:hidden;min-width:0}
.tile small{position:absolute;left:4px;right:4px;bottom:3px;font-size:9px;color:#fff;text-shadow:0 1px 3px #000;line-height:1.15;text-align:left;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.viewer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;gap:12px}
.vimg{width:100%;max-width:380px;aspect-ratio:3/4;max-height:56vh;border-radius:22px;display:grid;place-items:center;font-size:96px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.vcap{text-align:center;font-size:14px;line-height:1.5;padding:0 10px;color:#e6e8f0}
.vctl{display:flex;gap:10px;align-items:center}
.vctl .btn{min-width:56px}
/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px}
.calh b{font-size:18px}
.wk,.cg{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;text-align:center}
.wk span{font-size:12px;color:var(--sub);padding:6px 0}
.cg{gap:2px}
.cd{min-height:46px;border-radius:12px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.cd.sel{background:var(--card2);outline:1.5px solid var(--acc)}
.cd.today b{background:var(--acc);color:#fff}
.cd b{font-weight:500;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.cd.empty{pointer-events:none}
.cd.sun b{color:#ff7a7a}
.dd{display:flex;gap:3px;height:5px}.dd i{width:5px;height:5px;border-radius:50%;display:block}
.ev{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.ev i{width:5px;height:30px;border-radius:3px;flex:0 0 5px}
/* misc */
.acc2 .ah{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:8px 16px;width:100%;text-align:left;font-weight:600;font-size:15px}
.acd{display:none;padding:0 16px 14px;font-size:13.5px;line-height:1.55;color:#d5d8e2}
.acc2.open .acd{display:block}
.acc2{border-bottom:1px solid rgba(255,255,255,.06)}
.chev{transition:transform .2s;color:var(--sub)}.acc2.open .chev{transform:rotate(90deg)}
.bar{height:16px;border-radius:8px;background:#2b3040;display:flex;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub)}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.four div{aspect-ratio:3/4;border-radius:8px;background:#2b3040;display:grid;place-items:center;font-size:22px;text-align:center}
.four div.hl{background:linear-gradient(135deg,#ff9a3d,#ff5a78)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--sub);display:grid;place-items:center;font-size:15px;color:transparent;flex:0 0 28px}
.row.on .chk{background:var(--acc);border-color:var(--acc);color:#fff}
.chips{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);color:var(--sub);font-size:14px;font-weight:600;border:1px solid var(--line)}
.chip.on{background:rgba(255,90,120,.2);color:var(--acc);border-color:var(--acc)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 36px;max-width:360px;margin:0 auto}
.key{height:62px;border-radius:50%;background:var(--card2);font-size:26px;font-weight:300}
.dialnum{height:56px;text-align:center;font-size:32px;font-weight:300;padding-top:8px;letter-spacing:.04em}
.camv{flex:1;position:relative;background:linear-gradient(160deg,#1c1520,#3a2a2f 50%,#120f14);overflow:hidden;display:grid;place-items:center;font-size:20px;color:rgba(255,255,255,.35);text-align:center;padding:20px}
.camv .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.camv .fl.go{opacity:.9;transition:none}
.camb{display:flex;align-items:center;justify-content:space-around;height:110px;background:#000;flex:0 0 auto}
.shut{width:70px;height:70px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shut i{display:block;width:54px;height:54px;border-radius:50%;background:#fff}
.sq{width:50px;height:50px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:22px}
.camtop{display:flex;justify-content:space-between;padding:4px 12px;background:#000;flex:0 0 auto}
.camtop button{min-width:44px;min-height:44px;font-size:20px}
#lock{position:absolute;inset:0;z-index:90;background:radial-gradient(ellipse at 75% 18%,rgba(255,226,190,.55),transparent 50%),linear-gradient(170deg,#352731 0%,#6b4a52 38%,#b27f77 62%,#241a24 100%);display:flex;flex-direction:column;align-items:center;padding:calc(var(--sb) + 14px) 20px 30px;transition:transform .4s ease,opacity .4s ease,visibility 0s linear .4s}
#lock.unlocked{transform:translateY(-100%);opacity:0;visibility:hidden;pointer-events:none}
#lockDate{font-size:13px;font-weight:500;color:rgba(255,255,255,.85)}
#lockTime{font-size:46px;font-weight:100;color:rgba(255,255,255,.9);letter-spacing:.02em;line-height:1.1}
.lockcap{margin-top:auto;font-size:11.5px;padding:10px 14px;min-height:44px;border-radius:22px;background:rgba(0,0,0,.28);color:#fff;max-width:92%;text-align:center}
.lockbtns{display:flex;justify-content:space-between;width:100%;margin-top:18px;align-items:center}
.circ{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.35);font-size:22px;display:grid;place-items:center}
.circ.on{background:#fff;color:#000}
.unl{font-size:13px;color:rgba(255,255,255,.85);min-height:44px;padding:0 14px}
#homeBar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:170px;height:44px;z-index:110;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px}
#homeBar:active{transform:translateX(-50%) scale(.95)}
#homeBar i{display:block;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}
#phone.locked #homeBar{display:none}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);max-width:86%;background:rgba(40,42,54,.96);border:1px solid var(--line);padding:11px 16px;border-radius:16px;font-size:13.5px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center;line-height:1.4}
#toast.show{opacity:1;transform:translateX(-50%)}
.fpanel{width:100%;max-width:340px;background:rgba(40,42,56,.7);border-radius:30px;padding:18px 14px 20px;border:1px solid rgba(255,255,255,.1)}
.fpanel h3{text-align:center;font-size:20px;margin-bottom:16px}
.fpanel .apps4{grid-template-columns:repeat(3,1fr)}
.hero{margin:12px 14px;border-radius:22px;padding:18px;color:#fff;line-height:1.4}
.hero b{display:block;font-size:22px;margin-top:4px}
.hs{display:flex;gap:6px;padding:8px 14px}
.hs button{flex:1;min-height:44px;border-radius:12px;background:var(--card2);font-size:15px;font-weight:600}
.hs button.on{background:var(--acc);color:#fff}
@media (max-width:360px){.ico{width:52px;height:52px;font-size:27px}.page{padding:8px 12px 4px}.wx-t{font-size:28px}.wg .big{font-size:22px}.b{font-size:14px}.lbl{font-size:10px}}
</style>
</head>
<body>
<div id="stage">
<div id="phone" class="locked">
  <div id="wall"></div>
  <div id="statusbar">
    <span id="sbTime">12:07</span>
    <span class="sbr"><span>5G</span>
      <span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
      <span class="batt"><i style="width:86%"></i></span><span>86%</span></span>
  </div>

  <section id="home" aria-label="홈 화면">
    <div class="pages" id="pages">
      <div class="page" id="page1">
        <div class="wrow">
          <button class="wg" data-action="open" data-target="s-calendar" data-cal="2026-12-25" aria-label="디데이 위젯">
            <small>♥️ 커플 디데이</small>
            <div><div class="tt">♥️ 은성이랑 겨울까지</div><div class="big">D-Day 진행 중</div></div>
            <small id="ddaySub">12/25 첫 겨울 기념일</small>
          </button>
          <button class="wg" data-action="open" data-target="s-weather" aria-label="날씨 위젯">
            <small>서울 · 은성이 추위 체크</small>
            <div class="wx-t" id="wxNow">--°</div>
            <div class="wx-h" id="wxMini"></div>
          </button>
        </div>
        <div class="spacer"></div>
        <div class="apps4" id="row1"></div>
      </div>
      <div class="page" id="page2">
        <div class="apps4" id="grid2"></div>
        <div class="corner" id="corner2"></div>
      </div>
    </div>
    <div class="dots"><button class="dot on" data-action="page" data-page="0" aria-label="첫 페이지"><i></i></button><button class="dot" data-action="page" data-page="1" aria-label="둘째 페이지"><i></i></button></div>
    <div class="dock" id="dock"></div>
  </section>

  <div id="viewport"></div>

  <div id="lock" data-action="unlock" class="noanim">

  opt = opt || {};
  return '<section class="screen ' + (opt.cls || '') + '" id="' + id + '" aria-hidden="true">' +
    '<header class="nav"><button class="navbtn" data-action="back" aria-label="뒤로">‹</button><h2 id="' + id + '-title">' + esc(title) + '</h2>' + (opt.right || '<span class="navsp"></span>') + '</header>' +
    '<div class="body" id="' + id + '-body">' + body + '</div>' + (opt.after || '') + '</section>';
}
function row(attrs, av, main, sub, right) {
  return '<div class="row" role="button" tabindex="0" ' + attrs + '><div class="av">' + esc(av) + '</div><div class="rm"><div class="rt">' + main + '</div>' +
    (sub ? '<div class="rs">' + sub + '</div>' : '') + '</div>' + (right ? '<div class="rr">' + right + '</div>' : '') + '</div>';
}
function sw(on, msg) { return '<button class="sw' + (on ? ' on' : '') + '" data-action="toggle"' + (msg ? ' data-msg="' + esc(msg) + '"' : '') + ' aria-label="스위치"><i></i></button>'; }
function acc(title, html, open) {
  return '<div class="acc2' + (open ? ' open' : '') + '"><button class="ah" data-action="acc"><span>' + title + '</span><span class="chev">›</span></button><div class="acd">' + html + '</div></div>';
}

/* ---------- 화면 스택 ---------- */
var stack = ['home'];
var hooks = {};

function openScreen(id, el) {
  var s = document.getElementById(id);
  if (!s) return;
  if (hooks[id] && el) { safe(function () { hooks[id](el); }); }
  if (stack[stack.length - 1] === id) return;
  var ix = stack.indexOf(id);
  if (ix > -1) stack.splice(ix, 1);
  stack.push(id);
  s.style.zIndex = String(20 + stack.length * 2);
  s.classList.add('active');
  s.setAttribute('aria-hidden', 'false');
}
function closeEl(id) {
  var s = document.getElementById(id);
  if (!s) return;
  s.classList.remove('active');
  s.setAttribute('aria-hidden', 'true');
}
function goBack() {
  if (stack.length <= 1) return;
  closeEl(stack.pop());
}
function goHome() {
  while (stack.length > 1) closeEl(stack.pop());
  var p = $('#pages');
  if (p && p.scrollLeft > 0) { try { p.scrollTo({ left: 0, behavior: 'smooth' }); } catch (e) { p.scrollLeft = 0; } }
}

/* 장바구니 */
function updateCart() {
  var n = $$('#s-shop-body .row.on').length;
  $('#cartCnt').textContent = '담긴 상품 ' + CART.length + '개 · 선택 ' + n + '개';
}
function updateCheat() {
  var n = $$('#cheatRow .chip.on').length;
  $('#cheatCnt').textContent = '이번 주 치팅데이 ' + n + '회 ' + (n >= 4 ? '— 코치 몰래 유산소 2배로 메우는 중' : '');
}

/* 멜론 */
var playing = false, prog = 0, mTimer = null, mIdx = 0;
function setPlay(on) {
  playing = on;
  var b = $('#mPlay'); if (b) b.textContent = on ? '⏸ 일시정지' : '▶ 재생';
  clearInterval(mTimer);
  if (on) {
    mTimer = setInterval(function () {
      prog = (prog + 2) % 102;
      var p = $('#mProg'); if (p) p.style.width = Math.min(prog, 100) + '%';
    }, 500);
  }
}

/* ---------- 액션 ---------- */
var A = {};
A.noop = function () {};
A.open = function (el) { openScreen(el.dataset.target, el); };
A.back = function () { goBack(); };
A.home = function () { goHome(); };
A.page = function (el) {
  var p = $('#pages'), n = +el.dataset.page;
  try { p.scrollTo({ left: n * p.clientWidth, behavior: 'smooth' }); } catch (e) { p.scrollLeft = n * p.clientWidth; }
};
A.tab = function (el) {
  var scr = el.closest('.screen'), g = el.dataset.group, t = el.dataset.t;
  $$('.tab[data-group="' + g + '"]', scr).forEach(function (b) { b.classList.toggle('on', b === el); });
  $$('.pane[data-group="' + g + '"]', scr).forEach(function (p) { p.classList.toggle('on', p.dataset.pane === t); });
};
A.toggle = function (el) { el.classList.toggle('on'); if (el.dataset.msg) toast(el.dataset.msg); };
A.toast = function (el) { toast(el.dataset.msg || '👀'); };
A.acc = function (el) { el.parentNode.classList.toggle('open'); };
A.callDetail = function (el) { openScreen('s-callDetail', el); };
A.profile = function (el) { openScreen('s-profile', el); };
A.room = function (el) { openScreen('s-room', el); };
A.album = function (el) { openScreen('s-album', el); };
A.photo = function (el) { openScreen('s-viewer', el); };
A.vnav = function (el) { curIdx += parseInt(el.dataset.d, 10); renderViewer(); };
A.fav = function () { var k = curAlb + curIdx; favs[k] = !favs[k]; renderViewer(); toast(favs[k] ? '♥ 즐겨찾기에 추가' : '즐겨찾기 해제'); };
A.memoDetail = function () { openScreen('s-memoDetail'); };
A.web = function (el) { openScreen('s-webDetail', el); };
A.calnav = function (el) {
  cal.m += parseInt(el.dataset.d, 10);
  if (cal.m < 0) { cal.m = 11; cal.y--; }
  if (cal.m > 11) { cal.m = 0; cal.y++; }
  cal.d = 1; renderCal();
};
A.calday = function (el) { cal.d = +el.dataset.d; renderCal(); };
A.key = function (el) { var n = $('#dialNum'); if (n.textContent.length < 15) n.textContent += el.dataset.k; };
A.del = function () { var n = $('#dialNum'); n.textContent = n.textContent.slice(0, -1); };
A.dial = function () {
  var n = $('#dialNum').textContent;
  toast(n ? '📞 ' + n + ' 연결 중… (기록 열람용 화면)' : '번호를 먼저 눌러줘');
};
A.track = function (el) {
  mIdx = +el.dataset.i; $('#mTitle').textContent = TRACKS[mIdx][0]; prog = 0; setPlay(true);
};
A.play = function () { setPlay(!playing); };
A.chk = function (el) { el.classList.toggle('on'); updateCart(); };
A.like = function (el) {
  var on = el.classList.toggle('on');
  el.style.background = on ? 'var(--acc)' : '';
  if (el.dataset.k === 'down') toast(on ? '😠 비공감' : '비공감 취소'); else toast(on ? '👍 공감' : '공감 취소');
};
A.addr = function (el) {
  $$('.chip', el.parentNode).forEach(function (c) { c.classList.toggle('on', c === el); });
  $('#delAddrTxt').textContent = el.dataset.a;
};
A.bank = function (el) {
  $$('.hs button', el.parentNode).forEach(function (b) { b.classList.toggle('on', b === el); });
  var c = el.dataset.c.split(',');
  $('#bankHero').style.background = 'linear-gradient(135deg,' + c[0] + ',' + c[1] + ')';
  $('#bankName').textContent = el.dataset.b + ' 주계좌';
};
var revealed = false;
A.reveal = function () {
  revealed = !revealed;
  $('#bankBal').textContent = revealed ? '억 단위' : '••••••••';
  $('#revBtn').textContent = revealed ? '🙈 숨기기' : '👁 잔액 보기';
};
A.cheat = function (el) { el.classList.toggle('on'); updateCheat(); };
var shots = 0;
A.shutter = function () {
  shots++;
  var f = $('#camFl');
  f.classList.add('go');
  setTimeout(function () { f.classList.remove('go'); }, 60);
  toast('📸 찰칵 · 0.1초 · 오늘 ' + shots + '장 더 찍음');
};
A.flip = function () {
  var t = $('#camTxt'); var front = t.dataset.f === '1';
  t.dataset.f = front ? '0' : '1';
  t.innerHTML = front ? '🐈‍⬛<br><br>차은성이 귀여운 짓을 하면<br>0.1초 만에 찍는다' : '🐯<br><br>셀카 모드 · 호랑이 머리띠는 챙겼다';
};
var flashOn = false;
A.flash = function () { flashOn = !flashOn; $('#flashBtn').textContent = flashOn ? '⚡︎ 켬' : '⚡︎ 끔'; };
A.unlock = function () { $('#lock').classList.add('unlocked'); phone.classList.remove('locked'); };
A.torch = function (el) { el.classList.toggle('on'); toast(el.classList.contains('on') ? '🔦 손전등 켬' : '🔦 손전등 끔'); };
A.lockcam = function () { A.unlock(); openScreen('s-camera'); };

hooks['s-delivery'] = function (el) {
  var app = el.dataset.app;
  if (!app) return;
  $('#s-delivery-title').textContent = app === 'baemin' ? '배달의민족' : '쿠팡이츠';
  $('#delHero').style.background = app === 'baemin' ? 'linear-gradient(135deg,#12a99b,#0b4f4a)' : 'linear-gradient(135deg,#1672d6,#0b2c55)';
};
hooks['s-transit'] = function (el) {
  var app = el.dataset.app;
  if (!app) return;
  $('#s-transit-title').textContent = app === 'map' ? '카카오맵' : '지하철 종결자';
};

/* ---------- 이벤트 위임 ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el || !phone.contains(el)) return;
  var fn = A[el.dataset.action];
  if (!fn) return;
  try { fn(el, e); } catch (err) { if (window.console) console.error(err); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (!phone.classList.contains('locked')) goBack(); return; }
  if (e.key === 'Enter' || e.key === ' ') {
    var el = e.target && e.target.closest ? e.target.closest('.row[data-action]') : null;
    if (el) { e.preventDefault(); el.click(); }
  }
});

/* 잠금화면 스와이프 */
safe(function () {
  var lock = $('#lock'), sy = null;
  lock.addEventListener('touchstart', function (e) { sy = e.touches[0].clientY; }, { passive: true });
  lock.addEventListener('touchend', function (e) {
    if (sy !== null && e.changedTouches[0].clientY - sy < -60) A.unlock();
    sy = null;
  }, { passive: true });
});

/* 홈 페이지 점 */
safe(function () {
  var p = $('#pages');
  p.addEventListener('scroll', function () {
    var n = Math.round(p.scrollLeft / Math.max(1, p.clientWidth));
    $$('.dot').forEach(function (d, i) { d.classList.toggle('on', i === n); });
  }, { passive: true });
});

/* ---------- 시계 ---------- */
function tick() {
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  var t = h + ':' + (m < 10 ? '0' : '') + m;
  var a = $('#sbTime'), b = $('#lockTime');
  if (a) a.textContent = t;
  if (b) b.textContent = t;
}

/* ---------- 초기화 (각 단계 독립 실행) ---------- */
safe(renderHome);
safe(buildScreens);
safe(renderCalls);
safe(renderKakao);
safe(renderCal);
safe(renderWx);
safe(renderDday);
safe(updateCart);
safe(updateCheat);
safe(tick);
setInterval(function () { safe(tick); }, 15000);
});
</script>
</body>
</html>
